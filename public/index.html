<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UptimeLens</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 4px; }
    .sub { color: #94a3b8; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border-top: 6px solid #475569; }
    .card .label { color: #94a3b8; font-size: 14px; }
    .card .value { font-size: 40px; font-weight: 700; margin-top: 8px; }
    .card.green { border-top-color: #22c55e; }
    .card.amber { border-top-color: #f59e0b; }
    .card.red   { border-top-color: #ef4444; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .panel { background: #1e293b; border-radius: 12px; padding: 8px 20px; margin-bottom: 32px; }
    .row { padding: 12px 0; border-bottom: 1px solid #334155; }
    .row:last-child { border-bottom: none; }
    .empty { color: #94a3b8; padding: 16px 0; }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
    .tag.open { background: #7f1d1d; color: #fecaca; }
    .tag.done { background: #14532d; color: #bbf7d0; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50%      { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }
    .card { animation: fadeUp 0.5s ease backwards; transition: transform 0.2s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card.red { animation: fadeUp 0.5s ease backwards, pulse 2s infinite; }
    .panel { animation: fadeUp 0.6s ease 0.3s backwards; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>UptimeLens</h1>
    <div class="sub">Server health at a glance</div>

    <div class="cards">
      <div class="card" id="disk-card"><div class="label">Disk</div><div class="value" id="disk">--</div></div>
      <div class="card" id="mem-card"><div class="label">Memory</div><div class="value" id="mem">--</div></div>
      <div class="card" id="alerts-card"><div class="label">Open alerts</div><div class="value" id="open-count">--</div></div>
    </div>

    <h2>Alerts</h2>
    <div class="panel" id="alerts"></div>

    <h2>Recent readings</h2>
    <div class="panel" id="stats"></div>
  </div>

  <script>
    function level(pct) {
      if (pct >= 90) return 'red';
      if (pct >= 70) return 'amber';
      return 'green';
    }

    function setLevel(el, cls) {
      el.classList.remove('green', 'amber', 'red');
      el.classList.add(cls);
    }

    function loadStats() {
      fetch('/stats')
        .then(res => res.json())
        .then(readings => {
          const box = document.getElementById('stats');
          box.innerHTML = '';
          if (readings.length === 0) {
            box.innerHTML = '<div class="empty">No readings yet.</div>';
            return;
          }
          readings.sort((a, b) => new Date(b.recorded_at) - new Date(a.recorded_at));
          const latest = readings[0];
          const disk = Number(latest.disk_usage);
          const mem = Number(latest.memory_usage);

          document.getElementById('disk').textContent = disk + '%';
          document.getElementById('mem').textContent = mem + '%';
          setLevel(document.getElementById('disk-card'), level(disk));
          setLevel(document.getElementById('mem-card'), level(mem));

          readings.slice(0, 10).forEach(s => {
            const row = document.createElement('div');
            row.className = 'row';
            row.textContent = new Date(s.recorded_at).toLocaleString() +
              '  |  Disk ' + s.disk_usage + '%  |  Memory ' + s.memory_usage + '%';
            box.appendChild(row);
          });
        });
    }

    function loadAlerts() {
      fetch('/alerts')
        .then(res => res.json())
        .then(alerts => {
          const box = document.getElementById('alerts');
          box.innerHTML = '';
          const open = alerts.filter(a => !a.resolved).length;
          document.getElementById('open-count').textContent = open;
          setLevel(document.getElementById('alerts-card'), open === 0 ? 'green' : 'red');

          if (alerts.length === 0) {
            box.innerHTML = '<div class="empty">No alerts. Everything looks quiet.</div>';
            return;
          }
          alerts.forEach(a => {
            const row = document.createElement('div');
            row.className = 'row';
            row.textContent = a.message + ' (' + a.severity + ')';
            const tag = document.createElement('span');
            tag.className = 'tag ' + (a.resolved ? 'done' : 'open');
            tag.textContent = a.resolved ? 'resolved' : 'OPEN';
            row.appendChild(tag);
            box.appendChild(row);
          });
        });
    }

    function refresh() {
      loadStats();
      loadAlerts();
    }

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
