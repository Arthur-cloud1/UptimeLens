services:
   db:
     image: postgres:16
     environment:
       POSTGRES_USER: uptimelens
       POSTGRES_PASSWORD: uptimelens_dev
       POSTGRES_DB: uptimelens
       
   
   app:
     build: .
     ports:
       - "3000:3000"
     environment:
       DB_HOST: db
       DB_PORT: 5432
       DB_USER: uptimelens
       DB_PASSWORD: uptimelens_dev
       DB_NAME: uptimelens
     depends_on:
       - db
     volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
   pgdata:
