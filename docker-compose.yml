services:
   db:
     image: postgres:16
     restart: unless-stopped
     environment:
       POSTGRES_USER: uptimelens
       POSTGRES_PASSWORD: ${DB_PASSWORD}
       POSTGRES_DB: uptimelens
     volumes:
      - pgdata:/var/lib/postgresql/data   
   
   app:
     build: .
     restart: unless-stopped
     ports:
       - "3000:3000"
     environment:
       DB_HOST: db
       DB_PORT: 5432
       DB_USER: uptimelens
       DB_PASSWORD: ${DB_PASSWORD}
       DB_NAME: uptimelens
     depends_on:
       - db

volumes:
   pgdata:
